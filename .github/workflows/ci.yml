name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build · Lint · UT · IT · ST · DST
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          brew install swiftlint swiftformat
      - name: Check
        run: scripts/check

  e2e:
    name: Mac App E2E
    runs-on: macos-15
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: App smoke path
        run: scripts/test-e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: artifacts/e2e
          if-no-files-found: ignore
          retention-days: 14

name: NoonmarkIOS

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Noonmark:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  NoonmarkIOSApp:
    type: application
    platform: iOS
    sources:
      - path: App/NoonmarkIOSApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.noonmark.ios.development
        PRODUCT_NAME: Noonmark
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 晷迹
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - package: Noonmark
        product: NoonmarkCore
      - package: Noonmark
        product: NoonmarkMacRuntime
      - package: Noonmark
        product: NoonmarkAI
      - package: Noonmark
        product: NoonmarkZhulong
      - package: Noonmark
        product: NoonmarkZhulongAI
      - package: Noonmark
        product: NoonmarkDiagnostics
      - package: Noonmark
        product: NoonmarkStorage
      - package: Noonmark
        product: NoonmarkSync
    scheme:
      testTargets:
        - NoonmarkIOSTests
        - NoonmarkIOSUITests
      gatherCoverageData: false

  NoonmarkIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/NoonmarkIOSTests
    dependencies:
      - target: NoonmarkIOSApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.noonmark.ios.development.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Noonmark.app/Noonmark"

  NoonmarkIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/NoonmarkIOSUITests
    dependencies:
      - target: NoonmarkIOSApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.noonmark.ios.development.uitests
        GENERATE_INFOPLIST_FILE: YES

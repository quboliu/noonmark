name: Tencent IME Quality Matrix

on:
  schedule:
    - cron: '20 8 * * *'
  workflow_dispatch:

concurrency:
  group: tencent-ime-quality-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  matrix:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, noonmark-ui-e2e]
    timeout-minutes: 90
    env:
      NOONMARK_CODESIGN_IDENTITY: ${{ vars.NOONMARK_UI_CODESIGN_IDENTITY }}
      NOONMARK_REQUIRE_STABLE_UI_SIGNING: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Verify protected signing identity
        run: |
          if [[ -z "${NOONMARK_CODESIGN_IDENTITY:-}" ||
                "${NOONMARK_CODESIGN_IDENTITY}" == "-" ]]; then
            echo "NOONMARK_UI_CODESIGN_IDENTITY must explicitly name the runner signing identity" >&2
            exit 1
          fi
      - name: Run full Tencent IME quality matrix
        run: |
          scripts/test-tencent-ime-input-matrix
          scripts/test-tencent-ime-termination-persistence
      - name: Upload Tencent IME quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tencent-ime-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/e2e-tencent-ime-input-matrix
            artifacts/e2e-tencent-ime-termination
          if-no-files-found: error
          retention-days: 14

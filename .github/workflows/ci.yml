name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build · Lint · UT · IT · ST · DST
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      NOONMARK_EVIDENCE_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          [[ "$(xcodebuild -version | sed -n '1p')" == "Xcode 26.2" ]]
          brew install actionlint ripgrep swiftlint swiftformat
      - name: Check
        run: scripts/check
      - name: Upload check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-evidence
          path: artifacts/audit-final/make-check
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: Mac App E2E · Interactive WindowServer
    # Never execute mutable pull-request code on the persistent runner that owns
    # the UI signing identity and pre-authorized TCC entries. Pull requests keep
    # the hosted check job; the real GUI gate runs only after merge to main (or
    # an explicit workflow dispatch whose selected ref is main).
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, macOS, noonmark-ui-e2e]
    timeout-minutes: 75
    needs: check
    env:
      NOONMARK_CODESIGN_IDENTITY: ${{ vars.NOONMARK_UI_CODESIGN_IDENTITY }}
      NOONMARK_EVIDENCE_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      NOONMARK_REQUIRE_STABLE_UI_SIGNING: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Verify protected signing identity
        run: |
          if [[ -z "${NOONMARK_CODESIGN_IDENTITY:-}" ||
                "${NOONMARK_CODESIGN_IDENTITY}" == "-" ]]; then
            echo "NOONMARK_UI_CODESIGN_IDENTITY must explicitly name the runner signing identity" >&2
            exit 1
          fi
      - name: Verify the data-root writer lease
        run: scripts/test-data-root-process-lease-e2e
      - name: Verify interactive console and full real App paths
        run: scripts/test-e2e
      - name: Verify Tencent IME release smoke
        run: scripts/test-tencent-ime-release-smoke
      - name: Verify complete E2E evidence
        run: scripts/verify-development-validation-evidence --scope runtime
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            artifacts/e2e*
            artifacts/dmg-install-harness
          if-no-files-found: error
          retention-days: 14

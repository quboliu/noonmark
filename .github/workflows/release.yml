name: Development-signed Distribution Validation

on:
  workflow_dispatch:

concurrency:
  group: development-distribution-validation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, noonmark-ui-e2e]
    timeout-minutes: 120
    env:
      NOONMARK_CODESIGN_IDENTITY: ${{ vars.NOONMARK_UI_CODESIGN_IDENTITY }}
      NOONMARK_EVIDENCE_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      NOONMARK_REQUIRE_STABLE_UI_SIGNING: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Verify protected signing identity
        run: |
          if [[ -z "${NOONMARK_CODESIGN_IDENTITY:-}" ||
                "${NOONMARK_CODESIGN_IDENTITY}" == "-" ]]; then
            echo "NOONMARK_UI_CODESIGN_IDENTITY must explicitly name the runner signing identity" >&2
            exit 1
          fi
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          brew install swiftlint swiftformat
      - name: Verify
        run: scripts/check
      - name: Data-root writer lease E2E
        run: scripts/test-data-root-process-lease-e2e
      - name: Full App E2E
        run: scripts/test-e2e
      - name: Tencent IME input latency and durability
        run: |
          scripts/test-tencent-ime-input-matrix release
          scripts/test-tencent-ime-termination-persistence release
      - name: Verify complete E2E evidence
        run: scripts/verify-development-validation-evidence --scope runtime
      - name: Package artifact
        run: |
          scripts/package-dmg release
          scripts/verify-dmg dist/Noonmark.dmg
          scripts/test-dmg-install dist/Noonmark.dmg
          scripts/verify-development-validation-evidence --scope full
          ditto -c -k --keepParent dist/Noonmark.app dist/Noonmark.app.zip
          shasum -a 256 dist/Noonmark.app.zip > dist/Noonmark.app.zip.sha256
          shasum -a 256 -c dist/Noonmark.app.zip.sha256
          cat > dist/NOT-FOR-DISTRIBUTION.txt <<'NOTICE'
          These artifacts use an Apple Development identity for automated
          installation validation. They are not notarized and must not be
          distributed as a public Noonmark release.
          NOTICE
      - name: Upload development validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-signed-not-for-distribution
          path: |
            dist
            dist/Noonmark.app.dSYM
            artifacts/audit-final
            artifacts/e2e*
            artifacts/dmg-install*
          if-no-files-found: error
          retention-days: 14

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build · Lint · UT · IT · ST · DST
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          brew install swiftlint swiftformat
      - name: Check
        run: scripts/check

  e2e:
    name: Mac App E2E · Interactive WindowServer
    runs-on: [self-hosted, macOS, noonmark-ui-e2e]
    timeout-minutes: 20
    needs: check
    env:
      NOONMARK_CODESIGN_IDENTITY: ${{ vars.NOONMARK_UI_CODESIGN_IDENTITY }}
      NOONMARK_REQUIRE_STABLE_UI_SIGNING: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Verify interactive console and real App paths
        run: scripts/test-e2e
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            artifacts/e2e
            artifacts/e2e-runtime
          if-no-files-found: ignore
          retention-days: 14

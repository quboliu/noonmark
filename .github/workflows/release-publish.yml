name: Release

# Simplified tag-triggered release pipeline. The full validation chain
# (make check, real App E2E, writer lease, release-private-dmg) runs LOCALLY
# before tagging — that is the quality gate. This workflow runs on a
# GitHub-hosted runner and only re-verifies what works there
# (scripts/check), then packages, signs, and publishes the DMG as a public
# GitHub Release. The CI-built DMG is the canonical distribution artifact;
# see .github/RELEASING.md.
#
#   scripts/push-release-tag
#
# The distributed binary is Apple Development signed only: not notarized, not
# stapled. Users install it manually.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual entry; the selected ref must be an existing v* tag

# Never cancel a release mid-flight (a half-published version is worse than a
# queued one).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create/update the GitHub Release

jobs:
  publish:
    name: Check · Package · GitHub Release
    runs-on: macos-15
    timeout-minutes: 90
    environment: release
    env:
      NOONMARK_EVIDENCE_RUN_ID: github-release-${{ github.run_id }}-${{ github.run_attempt }}
      NOONMARK_CI_CERT_P12: ${{ runner.temp }}/noonmark-${{ github.run_id }}-${{ github.run_attempt }}.p12
      NOONMARK_CI_KEYCHAIN: ${{ runner.temp }}/noonmark-${{ github.run_id }}-${{ github.run_attempt }}.keychain-db
      NOONMARK_CI_SIGNING_PROBE: ${{ runner.temp }}/noonmark-${{ github.run_id }}-${{ github.run_attempt }}-signing-probe
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version and assert tag binding
        id: ver
        run: |
          MARKETING="$(scripts/release-version marketing-version)"
          BUILD="$(scripts/release-version build-number)"
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "::error::release workflow requires an existing v* tag ref, got ${GITHUB_REF}"
            exit 1
          fi
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" != "v${MARKETING}" ]]; then
            echo "::error::tag ${TAG} does not match release/VERSION marketing_version v${MARKETING}"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${MARKETING}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG} (build ${BUILD})"

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          brew install swiftlint swiftformat

      - name: Verify (build · lint · UT · IT · ST · DST)
        run: scripts/check

      - name: Import and prove Apple Development signing identity
        env:
          APPLE_DEV_CERT_P12_BASE64: ${{ secrets.APPLE_DEV_CERT_P12_BASE64 }}
          APPLE_DEV_CERT_PASSWORD: ${{ secrets.APPLE_DEV_CERT_PASSWORD }}
          APPLE_DEV_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_DEV_KEYCHAIN_PASSWORD }}
        run: |
          umask 077
          if [[ -z "${APPLE_DEV_CERT_P12_BASE64:-}" ||
                -z "${APPLE_DEV_CERT_PASSWORD:-}" ||
                -z "${APPLE_DEV_KEYCHAIN_PASSWORD:-}" ]]; then
            echo "::error::missing signing secrets (APPLE_DEV_CERT_P12_BASE64 / APPLE_DEV_CERT_PASSWORD / APPLE_DEV_KEYCHAIN_PASSWORD) — export guide: .github/RELEASING.md"
            exit 1
          fi
          printf '%s' "$APPLE_DEV_CERT_P12_BASE64" \
            | base64 -d > "$NOONMARK_CI_CERT_P12"
          chmod 0600 "$NOONMARK_CI_CERT_P12"
          security create-keychain \
            -p "$APPLE_DEV_KEYCHAIN_PASSWORD" "$NOONMARK_CI_KEYCHAIN"
          security set-keychain-settings \
            -lut 21600 "$NOONMARK_CI_KEYCHAIN"
          security unlock-keychain \
            -p "$APPLE_DEV_KEYCHAIN_PASSWORD" "$NOONMARK_CI_KEYCHAIN"
          security import "$NOONMARK_CI_CERT_P12" -k "$NOONMARK_CI_KEYCHAIN" \
            -P "$APPLE_DEV_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$APPLE_DEV_KEYCHAIN_PASSWORD" "$NOONMARK_CI_KEYCHAIN"
          security list-keychains -d user -s "$NOONMARK_CI_KEYCHAIN"

          identity_output="$(
            security find-identity -v -p codesigning "$NOONMARK_CI_KEYCHAIN"
          )"
          valid_count="$(
            sed -nE 's/^[[:space:]]*([0-9]+) valid identities found$/\1/p' \
              <<<"$identity_output"
          )"
          identity_hashes="$(
            sed -nE \
              's/^[[:space:]]*[0-9]+\) ([0-9A-F]{40}) "Apple Development:.*$/\1/p' \
              <<<"$identity_output"
          )"
          identity_count="$(
            awk 'NF { count += 1 } END { print count + 0 }' \
              <<<"$identity_hashes"
          )"
          if [[ "$valid_count" != "1" || "$identity_count" != "1" ]]; then
            echo "::error::signing keychain must contain exactly one valid Apple Development identity"
            exit 1
          fi
          identity_hash="$identity_hashes"
          security find-certificate -c 'Apple Development:' -p \
            "$NOONMARK_CI_KEYCHAIN" \
            | openssl x509 -noout -checkend 0
          printf '#!/bin/sh\nexit 0\n' > "$NOONMARK_CI_SIGNING_PROBE"
          chmod 0700 "$NOONMARK_CI_SIGNING_PROBE"
          codesign --force --sign "$identity_hash" \
            --keychain "$NOONMARK_CI_KEYCHAIN" \
            "$NOONMARK_CI_SIGNING_PROBE"
          codesign --verify --strict "$NOONMARK_CI_SIGNING_PROBE"
          rm -f "$NOONMARK_CI_CERT_P12"

      - name: Package production DMG
        run: scripts/package-dmg release

      - name: Verify DMG (static, read-only)
        run: scripts/verify-dmg dist/Noonmark.dmg

      - name: Remove signing material
        if: always()
        run: |
          cleanup_status=0
          rm -f "$NOONMARK_CI_CERT_P12" "$NOONMARK_CI_SIGNING_PROBE" || cleanup_status=1
          if [[ -e "$NOONMARK_CI_KEYCHAIN" ]]; then
            security delete-keychain "$NOONMARK_CI_KEYCHAIN" || cleanup_status=1
          fi
          exit "$cleanup_status"

      - name: Checksum and release notes
        run: |
          shasum -a 256 dist/Noonmark.dmg > dist/Noonmark.dmg.sha256
          shasum -a 256 -c dist/Noonmark.dmg.sha256
          awk '
            /^## 用户可见变化/ { grab=1; next }
            grab && /^## / { exit }
            grab { print }
          ' "docs/releases/v${{ steps.ver.outputs.version }}.md" > RELEASE_NOTES.md
          if [[ ! -s RELEASE_NOTES.md ]]; then
            echo "Noonmark ${{ steps.ver.outputs.version }} (${{ steps.ver.outputs.build }})" \
              > RELEASE_NOTES.md
          fi
          {
            echo ""
            echo "---"
            echo "- Build: ${{ steps.ver.outputs.build }} · Commit: ${GITHUB_SHA}"
            echo "- Apple Development signed; not notarized. Install manually."
            echo "- SHA-256: see Noonmark.dmg.sha256"
          } >> RELEASE_NOTES.md
          echo "---- release notes ----"; cat RELEASE_NOTES.md

      - name: Create immutable GitHub Release
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          TITLE="Noonmark ${{ steps.ver.outputs.version }} (${{ steps.ver.outputs.build }})"
          RELEASE_VIEW_ERROR="$RUNNER_TEMP/noonmark-release-view-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          if gh release view "$TAG" >/dev/null 2>"$RELEASE_VIEW_ERROR"; then
            echo "::error::GitHub Release already exists; refusing to overwrite this build"
            exit 1
          fi
          if ! grep -Eqi 'release not found|HTTP 404' "$RELEASE_VIEW_ERROR"; then
            echo "::error::cannot prove that GitHub Release ${TAG} is absent"
            exit 1
          fi
          rm -f "$RELEASE_VIEW_ERROR"
          gh release create "$TAG" \
            dist/Noonmark.dmg \
            dist/Noonmark.dmg.sha256 \
            --title "$TITLE" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag \
            --latest
          ACTUAL_TAG="$(gh release view "$TAG" --json tagName --jq '.tagName')"
          if [[ "$ACTUAL_TAG" != "$TAG" ]]; then
            echo "::error::GitHub Release tag mismatch: expected ${TAG}, got ${ACTUAL_TAG}"
            exit 1
          fi
          gh release view "$TAG" --json assets --jq ".assets[].name" \
            | grep -qxF "Noonmark.dmg" \
            || { echo "::error::GitHub Release missing asset Noonmark.dmg"; exit 1; }
          PUBLIC_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Noonmark.dmg"
          for _ in 1 2 3 4 5 6; do
            curl -fsIL "$PUBLIC_URL" >/dev/null && exit 0
            sleep 5
          done
          echo "::error::GitHub Release asset is not publicly downloadable: ${PUBLIC_URL}"
          exit 1

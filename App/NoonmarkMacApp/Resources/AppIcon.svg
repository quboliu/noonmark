<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="1024"
  viewBox="0 0 1024 1024"
  fill="none"
>
  <defs>
    <linearGradient id="noonmark-blue" x1="232" y1="124" x2="812" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3478E8"/>
      <stop offset="0.5" stop-color="#174BB9"/>
      <stop offset="1" stop-color="#0B2D79"/>
    </linearGradient>
    <linearGradient id="solar-gold" x1="452" y1="268" x2="588" y2="912" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE17A"/>
      <stop offset="0.5" stop-color="#FFC13C"/>
      <stop offset="1" stop-color="#E89117"/>
    </linearGradient>
    <clipPath id="icon-body">
      <rect x="100" y="88" width="824" height="824" rx="188"/>
    </clipPath>
    <mask id="trace-cut" x="100" y="88" width="824" height="824" maskUnits="userSpaceOnUse">
      <rect x="100" y="88" width="824" height="824" fill="white"/>
      <path
        d="M 548 568 L 888 912 L 924 758 Z"
        fill="black"
      />
    </mask>
  </defs>

  <!-- The 824 px body follows the apparent size of current macOS system icons. -->
  <rect x="100" y="88" width="824" height="824" rx="188" fill="url(#noonmark-blue)"/>

  <!-- One brand glyph: the noon gnomon and its permanent daily trace. -->
  <g clip-path="url(#icon-body)" mask="url(#trace-cut)" fill="url(#solar-gold)">
    <path
      d="M 100 770
         C 196 646 326 578 468 550
         L 468 398
         C 469 350 480 310 506 280
         L 548 250
         C 558 243 570 250 570 262
         L 570 550
         C 712 576 838 650 924 770
         L 924 912
         L 100 912 Z"
    />
  </g>
</svg>

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build · Lint · UT · IT · ST · DST
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      NOONMARK_EVIDENCE_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          [[ "$(xcodebuild -version | sed -n '1p')" == "Xcode 26.2" ]]
          brew install actionlint ripgrep swiftlint
          scripts/install-pinned-swiftformat >/dev/null
      - name: Check
        run: scripts/check
      - name: Upload check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-evidence
          path: artifacts/audit-final/make-check
          if-no-files-found: error
          retention-days: 14
